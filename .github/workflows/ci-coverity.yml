name: Reusable Coverity flow

on:
  workflow_call:
    secrets:
      GIT_USER:
        required: true
      GIT_TOKEN:
        required: true
    inputs:
      base_ref:
        required: true
        type: string
      head_ref:
        required: true
        type: string

env:
  WORKFLOW_REPO_REF: cicd-2025.12

jobs:
  ci-coverity-build:
    runs-on: [ arc, lapwing, workspace_type=tmp-workspace, coverity/2024.3.0 ]
    env:
      # Disable the warnings of Security violation. We need to check why this is trigger later, plaintext password.
      EC_DISABLE_VAL: project,system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Workflow Script checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW_REPO_REF }}
          repository: altera-innersource/applications.devops.build-bot.github-pr-workflow
          path: workflow_scripts
          token: ${{ secrets.GIT_TOKEN }}

      - name: Run Coverity Build
        id: coverity-build
        run: |
          export WORK_DIR=$RUNNER_TEMP
          python3 workflow_scripts/workflow_Coverity_Build.py ${{ github.workspace }} --software-component atf ${{ inputs.head_ref }} ${{ inputs.base_ref }}

      - name: atf-coverity-result-json
        uses: actions/upload-artifact@v4
        with:
          name: atf-coverity-result-json
          path: ${{ github.workspace }}/coverity_results.tar.gz
          retention-days: 1

  ci-coverity-parse-result:
    needs: ci-coverity-build
    runs-on: [ arc, lapwing, workspace_type=tmp-workspace, python/3.12.10 ]

    steps:

      - name: Workflow Script checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW_REPO_REF }}
          repository: altera-innersource/applications.devops.build-bot.github-pr-workflow
          path: workflow_scripts
          token: ${{ secrets.GIT_TOKEN }}

      - name: Download coverity result
        uses: actions/download-artifact@v4
        with:
          name: atf-coverity-result-json
      - run: |
          tar -xzf coverity_results.tar.gz
          ls -al

      - name : Run Coverity Parser
        run: |
          export PYTHONUSERBASE=$RUNNER_TEMP/.local
          mkdir -p $PYTHONUSERBASE
          bash workflow_scripts/workflow_Coverity_Parser.sh ${{ github.workspace }} ${{ github.event.repository.name }} ${{ secrets.GITHUB_TOKEN }} ${{ github.event.pull_request.number }}

      - name: atf-coverity-report
        uses: actions/upload-artifact@v4
        with:
          name: atf-coverity-report
          path: ${{ github.workspace }}/atf_output_defect.csv
          retention-days: 1
